</head>
<body>

<header>
    <section class="site-header">
        <a href="index.html" aria-label="Dutch Car Tuning Guide home">
            <img class="logo" src="img/logo.jpg.png" alt="Dutch Car Tuning Guide logo" title="Dutch Car Tuning Guide logo">

        <nav aria-label="Main navigation">
            <ul>

            </ul>
        </nav>
    </section>
</header>

<main>

<section class="contact-layout">
    <article>
        <h1>Do you still have questions?</h1>
        <p>Fill out the form for an efficient response!</p>
       
    </article>
    <form action="#" method="post">
        <fieldset>
            <legend>Contact form</legend>
            <label for="salutation">Salutation</label>
            <select id="salutation" name="salutation" required>
                <option value="">Choose an option</option>
                <option value="Mr.">Mr.</option>
                <option value="Ms.">Ms.</option>
                <option value="Mx.">Mx.</option>
            </select>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="ex: John Doe" required>
            <label for="birth-date">Date of birth</label>
            <input id="birth-date" name="birth-date" type="date">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="ex: johndoe@gmail.com" required>
            <label for="contact">Contact</label>
            <input id="contact" name="contact" type="tel" placeholder="ex: +31 635297658">
            <label for="question">What can we help you with?</label>
            <textarea id="question" name="question" placeholder="Write your question here!" required></textarea>
            <input type="submit" value="Submit">
        </fieldset>
    </form>
</section>
<section class="content-panel">
    <h2>Thank you!</h2>
    <p>Your response has been submitted successfully!</p>
    
</section>

</main>
<footer>
    <p>© 2026 Dutch Car Tuning Guide. All rights reserved.</p>
</footer>

</body>
</html>
